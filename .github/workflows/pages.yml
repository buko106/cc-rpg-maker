name: Pages

# main に入ったら、ランディング + エディタ + デモを GitHub Pages に公開する。
# 公開先: https://www.buko106.tokyo/cc-rpg-maker/
#   /           ランディングページ（site/）
#   /editor/    エディタ
#   /demo/      demo プロジェクト付きのプレイヤー
# 初回だけ、リポジトリの Settings → Pages → Source を「GitHub Actions」にする。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は 1 本ずつ。新しい push が来たら、待っている古い公開は捨てて最新だけ出す。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
